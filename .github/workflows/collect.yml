name: Collect trend data

on:
  schedule:
    - cron: "0 1 * * *" # 08:00 Asia/Bangkok (UTC+7)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Google Trends data
        run: python scripts/collect_trends.py

      - name: Collect NewsAPI data
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/collect_news.py

      - name: Detect anomalies
        run: python scripts/detect_anomalies.py

      - name: Generate AI explanations
        continue-on-error: true # best-effort: never block the data commit below
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/explain_trend.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/timeseries.json data/trend_status.json
          git diff --cached --quiet || git commit -m "data: daily trend collection $(date -u +%Y-%m-%d)"
          git push
